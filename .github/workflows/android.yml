name: Build Android APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Copy the web app in
        run: |
          mkdir -p www
          cp ../index.html www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Make launcher icons
        continue-on-error: true
        run: npx @capacitor/assets generate --android --assetPath assets
      - name: Allow the microphone
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Build the APK (signed if a signing key is set up, otherwise a test build)
        working-directory: android-app/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            ./gradlew assembleRelease
            echo "$KS_B64" | base64 -d > ../release.p12
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk ../aligned.apk
            "$BT/apksigner" sign --ks ../release.p12 --ks-type pkcs12 --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --out ../KN-Woodwinds-Transcription-Player.apk ../aligned.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../KN-Woodwinds-Transcription-Player.apk
          fi
      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-app/KN-Woodwinds-Transcription-Player.apk
      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/KN-Woodwinds-Transcription-Player.apk
